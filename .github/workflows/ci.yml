name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned instead of following the runner default.
  DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer

jobs:
  swift-modules:
    name: Swift modules
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: ./Scripts/bootstrap.sh
      - name: Lint Swift sources
        run: ./Scripts/lint.sh
      - name: Test OhMyThemeKit
        run: ./Scripts/test-package.sh

  macos-app:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: ./Scripts/bootstrap.sh
      - name: Build app
        run: ./Scripts/build-app.sh
      - name: Run app-hosted smoke tests
        run: ./Scripts/test-app.sh
