name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub exposes macOS 15 through a moving label; it does not offer a
  # patch-level hosted-runner image. Pin the selectable Xcode bundle instead.
  DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
  NODE_VERSION: 22.23.2
  NPM_VERSION: 11.16.0
  OMT_REQUIRE_PINNED_TOOLCHAIN: "1"

jobs:
  swift-lint:
    name: Swift lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check pinned Xcode toolchain
        run: |
          test "$DEVELOPER_DIR" = "/Applications/Xcode_26.1.1.app/Contents/Developer"
          ./Scripts/bootstrap.sh
      - name: Lint Swift sources
        run: ./Scripts/lint.sh

  package-tests:
    name: Package, migration, and adapter safety tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check pinned Xcode toolchain
        run: ./Scripts/bootstrap.sh
      - name: Run all OhMyThemeKit tests
        # The package suite includes persistence migrations and the shared
        # writable-adapter safety contract in ThemeEngineTests.
        run: ./Scripts/test-package.sh

  macos-app:
    name: Unsigned app build and app-hosted tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check pinned Xcode toolchain
        run: ./Scripts/bootstrap.sh
      - name: Build unsigned app
        run: ./Scripts/build-app.sh CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Run unsigned app-hosted tests
        run: ./Scripts/test-app.sh CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  themes:
    name: Theme validation and generated catalog
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check pinned Xcode toolchain
        run: ./Scripts/bootstrap.sh
      - name: Validate theme packs and generated catalog
        run: ./Scripts/test-themes.sh

  vscode-tests:
    name: VS Code unit and pinned extension-host tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Extensions/VSCode/oh-my-theme-companion/package-lock.json
      - name: Pin npm and check JavaScript toolchain
        run: |
          npm install --global "npm@$NPM_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Run unit and required extension-host tests
        env:
          OMT_REQUIRE_VSCODE_HOST_TESTS: "1"
        run: ./Scripts/prove-vscode-companion.sh

  vscode-generated:
    name: Checked-in VSIX and checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Extensions/VSCode/oh-my-theme-companion/package-lock.json
      - name: Pin npm and check JavaScript toolchain
        run: |
          npm install --global "npm@$NPM_VERSION"
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Rebuild and verify checked-in generated output
        run: ./Scripts/check-vscode-generated.sh

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1
      - name: Scan every commit
        if: always()
        run: gitleaks detect --source . --redact --verbose --log-opts="--all"
